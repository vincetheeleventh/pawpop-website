name: Send Upload Reminders

on:
  schedule:
    # Run every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    
    steps:
      - name: Verify configuration
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOYMENT_URL }}" ]; then
            echo "❌ Missing required secret: VERCEL_DEPLOYMENT_URL"
            echo "Set this to your production URL, e.g. https://pawpopart.com"
            exit 1
          fi
          echo "VERCEL_DEPLOYMENT_URL is set to: ${{ secrets.VERCEL_DEPLOYMENT_URL }}"

      - name: Send upload reminders
        run: |
          echo "Sending upload reminders..."

          URL="${{ secrets.VERCEL_DEPLOYMENT_URL }}/api/email/upload-reminder?send=true&hours=24&maxReminders=3"
          echo "Requesting: $URL"

          # Follow redirects (-L), show errors (-S), silent progress (-s), write body to file (-o), capture HTTP code (-w)
          http_code=$(curl -sS -L -o response.json -w "%{http_code}" "$URL")

          echo "Response code: $http_code"
          echo "Response body:"
          cat response.json || true

          # Treat any non-2xx as failure
          if ! echo "$http_code" | grep -qE '^2[0-9]{2}$'; then
            echo "❌ Failed to send reminders (HTTP $http_code)"
            exit 1
          fi

          echo "✅ Upload reminders request completed successfully"
